<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#f9fafb" />
    <title>404 | Forgent3D</title>
    <link rel="icon" type="image/png" href="/logo-mark.png" />
    <!--
      这页是静态兜底,不经过 Next 也就吃不到 Tailwind 产出的 CSS —— 所以颜色在这里写死一份。
      值全部取自 app/globals.css 的浅色 token(背景 #f9fafb / 文字 #191c24 / 描边 #d6dae0 /
      品牌 #0886a6),改主题时别忘了这一处。
    -->
    <style>
      :root { color-scheme: light; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 24px;
        background: #f9fafb;
        color: #191c24;
        font-family: ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "Helvetica Neue", Arial, "PingFang SC", "Microsoft YaHei", sans-serif;
      }
      main { max-width: 560px; text-align: left; }
      .eyebrow {
        margin: 0;
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.18em;
        color: #616875;
      }
      h1 { margin: 12px 0 0; font-size: clamp(1.75rem, 6vw, 2.5rem); font-weight: 600; letter-spacing: -0.01em; }
      p.lead { margin: 16px 0 0; line-height: 1.7; color: #616875; }
      a.button {
        display: inline-flex;
        align-items: center;
        margin-top: 28px;
        height: 40px;
        padding: 0 20px;
        border-radius: 6px;
        background: #0886a6;
        color: #f9fafb;
        font-size: 0.875rem;
        font-weight: 500;
        text-decoration: none;
      }
      a.button:hover { background: #0a7793; }
    </style>
  </head>
  <body>
    <main>
      <p class="eyebrow">404</p>
      <h1>页面不存在</h1>
      <p class="lead">这个地址没有对应页面。返回首页继续查看 Forgent3D 的产品介绍和下载入口。</p>
      <a class="button" href="/">返回首页</a>
    </main>
  </body>
</html>
