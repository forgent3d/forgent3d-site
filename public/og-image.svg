<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!--
    社交卡片。配色和 app/globals.css 的浅色 token 一一对应:底 #f9fafb、表面 #ffffff、
    描边 #d6dae0、正文 #191c24 / #616875、品牌青 #0886a6。字体用系统栈 —— 站点已经不再加载
    Space Grotesk 了,这里再写它只会在抓取端退回默认字体。
  -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- 环境层:顶部一片品牌辉光 + 淡出的网格,和首页的 AmbientBackdrop 同一张底 -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- 字标:一枚小等轴方块 + 名字,和右侧那枚是同一个母题 -->
  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M89 66l17 10v19l-17 10-17-10V76z"/>
    <path d="M89 86v19M89 86l17-10M89 86l-17-10" stroke-opacity="0.45"/>
  </g>
  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Forgent3D</text>

  <text x="72" y="212" fill="#616875" font-size="18" letter-spacing="3.2" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">CLOUD CAD SANDBOX · HOSTED AI AGENT</text>
  <text x="72" y="292" fill="#191C24" font-size="58" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">AI CAD agent</text>
  <text x="72" y="360" fill="#191C24" font-size="58" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">in the cloud</text>
  <text x="72" y="416" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Editable CAD code, built and previewed</text>
  <text x="72" y="450" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">in the browser — plus a skill for your own agent.</text>

  <!-- 主按钮:和站内主动作同一块实心品牌色,没有渐变也没有辉光 -->
  <rect x="72" y="496" width="212" height="50" rx="6" fill="#0886A6"/>
  <text x="178" y="528" fill="#F9FAFB" font-size="19" font-weight="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Sign in to start</text>
  <rect x="300" y="496" width="196" height="50" rx="6" fill="#FFFFFF" stroke="#D6DAE0"/>
  <text x="398" y="528" fill="#616875" font-size="19" font-weight="500" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Install the skill</text>

  <!-- 右侧:一枚等轴线框方块,产品里 logo 的 cube-trace 是同一个母题 -->
  <rect x="744" y="140" width="384" height="350" rx="16" fill="#FFFFFF" stroke="#D6DAE0"/>
  <g stroke="#0886A6" stroke-width="2.5" stroke-linejoin="round" fill="none">
    <path d="M936 205l108 62v124l-108 62-108-62V267z"/>
    <path d="M936 205v124M936 329l108-62M936 329l-108-62M936 329v124" stroke-opacity="0.45"/>
  </g>
  <circle cx="936" cy="205" r="6" fill="#0886A6"/>
  <circle cx="1044" cy="267" r="6" fill="#0886A6"/>
  <circle cx="828" cy="267" r="6" fill="#0886A6"/>
</svg>
