<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- /[locale]/openscad-to-stl 的社交卡片(zh)。右侧:带三角面的块和 model.stl。
       改完用无头 Chromium 截成同名 .png(1200×630),或 sharp('x.svg').png().toFile('x.png')。 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#gridFade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M89 66l17 10v19l-17 10-17-10V76z"/>
    <path d="M89 86v19M89 86l17-10M89 86l-17-10" stroke-opacity="0.45"/>
  </g>
  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Forgent3D</text>

  <text x="72" y="264" fill="#191C24" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">OpenSCAD</text>
  <text x="72" y="340" fill="#0886A6" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">转 STL</text>
  <text x="72" y="410" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">真正的 OpenSCAD 在浏览器里渲染，</text>
  <text x="72" y="444" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">一键导出给切片软件的 STL。</text>

  <rect x="712" y="120" width="424" height="390" rx="16" fill="#FFFFFF" stroke="#D6DAE0"/>
  <!-- 三角面网格的块 + 一个 model.stl 标签:导出的是 OpenSCAD 自己的三角面 -->
  <g transform="translate(924 296) scale(1)">
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z" fill="#CDEAF2"/>
    <path d="M-120 -40 L0 20 L0 100 L-120 40 Z" fill="#8CC9DB"/>
    <path d="M0 20 L120 -40 L120 40 L0 100 Z" fill="#A9D8E6"/>
    <path d="M-120 -40 L120 -40 M0 -100 L0 20 M-60 -70 L60 -10 M60 -70 L-60 -10 M-60 -10 L-60 70 M-120 0 L0 60 M-120 -40 L0 100 M60 -10 L60 70 M0 60 L120 0 M0 20 L120 40" fill="none" stroke="#0886A6" stroke-opacity="0.55" stroke-width="1.4"/>
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z M-120 -40 L-120 40 L0 100 L120 40 L120 -40 M0 20 L0 100" fill="none" stroke="#191C24" stroke-opacity="0.35" stroke-width="1.4"/>
  </g>
  <rect x="854" y="418" width="140" height="34" rx="17" fill="#0886A6"/>
  <text x="924.0" y="441" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model.stl</text>
  <text x="924" y="488" fill="#616875" font-size="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">二进制 STL · 直接切片</text>
</svg>
