  <text x="748" y="404" fill="#616875" font-size="14" font-weight="600" letter-spacing="2" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">盖子</text>
  <rect x="748" y="420" width="22" height="22" rx="5" fill="#0886A6"/>
  <path d="M753 431l4.5 4.5 8-9" stroke="#FFFFFF" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
