  <text x="748" y="330" fill="#191C24" font-size="18" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">壁厚</text>
  <text x="1100" y="330" fill="#0886A6" font-size="18" font-weight="600" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">2.0</text>
