<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- /[locale]/openscad-customizer 的社交卡片(zh)。右侧:Customizer 面板。
       改完用无头 Chromium 截成同名 .png(1200×630),或 sharp('x.svg').png().toFile('x.png')。 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#gridFade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M89 66l17 10v19l-17 10-17-10V76z"/>
    <path d="M89 86v19M89 86l17-10M89 86l-17-10" stroke-opacity="0.45"/>
  </g>
  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Forgent3D</text>

  <text x="72" y="264" fill="#191C24" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">OpenSCAD</text>
  <text x="72" y="340" fill="#0886A6" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">在线定制</text>
  <text x="72" y="410" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Thingiverse 的 .scad 拿来就改：</text>
  <text x="72" y="444" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">注释变成滑块，改完导出 STL。</text>

  <rect x="712" y="120" width="424" height="390" rx="16" fill="#FFFFFF" stroke="#D6DAE0"/>
  <!-- Customizer 面板:注释变成的滑块和勾选框 -->
  <text x="748" y="168" fill="#616875" font-size="14" font-weight="600" letter-spacing="2" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">盒子</text>
  <text x="748" y="206" fill="#191C24" font-size="18" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">宽度</text>
  <text x="1100" y="206" fill="#0886A6" font-size="18" font-weight="600" text-anchor="end" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">80</text>
  <rect x="748" y="220" width="352" height="6" rx="3" fill="#E3E7EC"/>
