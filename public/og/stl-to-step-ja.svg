  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, WenQuanYi Zen Hei, IPAGothic, sans-serif">Forgent3D</text>
  <text x="72" y="264" fill="#191C24" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, WenQuanYi Zen Hei, IPAGothic, sans-serif">STLをSTEPに</text>
