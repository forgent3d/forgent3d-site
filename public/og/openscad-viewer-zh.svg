<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- /[locale]/openscad-viewer 的社交卡片。右侧是 F5 配色的示意:红色 color() 的块、difference 挖出的绿色孔壁、半透明灰的 % 板。
       改完用无头 Chromium 截成同名 .png(1200×630),或 sharp('x.svg').png().toFile('x.png')。 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#gridFade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M89 66l17 10v19l-17 10-17-10V76z"/>
    <path d="M89 86v19M89 86l17-10M89 86l-17-10" stroke-opacity="0.45"/>
  </g>
  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Forgent3D</text>

  <text x="72" y="264" fill="#191C24" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">OpenSCAD</text>
  <text x="72" y="340" fill="#0886A6" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">在线预览</text>
  <text x="72" y="410" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">真正的 OpenSCAD 在浏览器里运行，边写边看；</text>
  <text x="72" y="444" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">color()、% 和 # 和桌面版 F5 一样。</text>

  <!-- 预览卡片:等轴测的红色块,顶面一个绿壁的孔,下面一块半透明的 % 板 -->
  <rect x="712" y="120" width="424" height="390" rx="16" fill="#FFFFFF" stroke="#D6DAE0"/>
  <g transform="translate(924 330)">
    <!-- % 板(背景,半透明灰) -->
    <g opacity="0.45">
      <path d="M-190 40 L0 135 L190 40 L0 -55 Z" fill="#B3B3B3"/>
      <path d="M-190 40 L0 135 L0 150 L-190 55 Z" fill="#9A9A9A"/>
      <path d="M0 135 L190 40 L190 55 L0 150 Z" fill="#A6A6A6"/>
    </g>
    <!-- 红色 color() 的块 -->
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z" fill="#F0413B"/>
    <path d="M-120 -40 L0 20 L0 100 L-120 40 Z" fill="#B82E2A"/>
    <path d="M0 20 L120 -40 L120 40 L0 100 Z" fill="#D63A35"/>
    <!-- 顶面的孔:绿色的壁 + 孔口 -->
    <ellipse cx="0" cy="-40" rx="40" ry="20" fill="#7FAE3E"/>
    <path d="M-40 -40 A40 20 0 0 0 40 -40 L40 -22 A40 20 0 0 1 -40 -22 Z" fill="#9DCB51"/>
    <ellipse cx="0" cy="-22" rx="40" ry="20" fill="#6E9A33"/>
    <ellipse cx="0" cy="-40" rx="40" ry="20" fill="none" stroke="#B82E2A" stroke-opacity="0.5"/>
    <!-- 棱线 -->
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z M-120 -40 L-120 40 L0 100 L120 40 L120 -40 M0 20 L0 100" fill="none" stroke="#191C24" stroke-opacity="0.35" stroke-width="1.4"/>
  </g>
  <text x="924" y="478" fill="#616875" font-size="18" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">color() · difference() · %</text>
</svg>
