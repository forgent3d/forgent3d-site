<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- /[locale]/openscad-to-step 的社交卡片。管子的几何和 app/[locale]/openscad-to-step/tube-figure.js 的 TUBE 同一组数(网格 = $fn 32 的 STL,256 个三角面)。
       改完用 sharp 渲成同名 .png:sharp('x.svg').png().toFile('x.png')。 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>

  <!-- 环境层:顶部一片品牌辉光 + 淡出的网格,和首页的 AmbientBackdrop 同一张底 -->
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask">
      <rect width="1200" height="630" fill="url(#gridFade)"/>
    </mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <!-- 字标:一枚小等轴方块 + 名字,和右侧那枚是同一个母题 -->
  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
