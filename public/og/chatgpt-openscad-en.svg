<svg width="1200" height="630" viewBox="0 0 1200 630" fill="none" xmlns="http://www.w3.org/2000/svg">
  <!-- /[locale]/chatgpt-openscad 的社交卡片(en)。右侧:对话气泡里的代码 → 块 + model.stl。
       改完用无头 Chromium 截成同名 .png(1200×630),或 sharp('x.svg').png().toFile('x.png')。 -->
  <rect width="1200" height="630" fill="#F9FAFB"/>
  <defs>
    <radialGradient id="glow" cx="0.5" cy="0" r="0.75">
      <stop offset="0%" stop-color="#0886A6" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#0886A6" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="46" height="46" patternUnits="userSpaceOnUse">
      <path d="M46 0H0V46" fill="none" stroke="#D6DAE0" stroke-width="1"/>
    </pattern>
    <linearGradient id="gridFade" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#FFFFFF" stop-opacity="0"/>
    </linearGradient>
    <mask id="gridMask"><rect width="1200" height="630" fill="url(#gridFade)"/></mask>
  </defs>
  <rect width="1200" height="630" fill="url(#grid)" mask="url(#gridMask)"/>
  <rect width="1200" height="400" fill="url(#glow)"/>

  <g stroke="#0886A6" stroke-width="2.2" stroke-linejoin="round" fill="none">
    <path d="M89 66l17 10v19l-17 10-17-10V76z"/>
    <path d="M89 86v19M89 86l17-10M89 86l-17-10" stroke-opacity="0.45"/>
  </g>
  <text x="122" y="97" fill="#191C24" font-size="27" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Forgent3D</text>

  <text x="72" y="264" fill="#191C24" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">From ChatGPT</text>
  <text x="72" y="340" fill="#0886A6" font-size="64" font-weight="600" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">to your printer</text>
  <text x="72" y="410" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">Paste the OpenSCAD code: it renders,</text>
  <text x="72" y="444" fill="#616875" font-size="24" font-family="ui-sans-serif, system-ui, -apple-system, Segoe UI, Roboto, Helvetica Neue, Arial, sans-serif">errors show their line, STL exports.</text>

  <rect x="712" y="120" width="424" height="390" rx="16" fill="#FFFFFF" stroke="#D6DAE0"/>
  <!-- 对话气泡里的一段 OpenSCAD → 渲染出来的块 + model.stl -->
  <rect x="740" y="146" width="368" height="172" rx="14" fill="#F3F5F8" stroke="#D6DAE0"/>
  <path d="M772 317 L772 340 L796 317 Z" fill="#F3F5F8" stroke="#D6DAE0" stroke-linejoin="round"/>
  <path d="M773 316.2 L795 316.2" stroke="#F3F5F8" stroke-width="2.4"/>
  <text x="760" y="180" font-size="15" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#191C24">angle = 65; </tspan><tspan fill="#0886A6">// [50:80]</tspan></text>
  <text x="760" y="208" font-size="15" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#191C24">difference() {</tspan></text>
  <text x="760" y="236" font-size="15" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#191C24">  cube([80, 70, 4]);</tspan></text>
  <text x="760" y="264" font-size="15" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#191C24">  rotate([0, 25, 0]) …</tspan></text>
  <text x="760" y="292" font-size="15" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" xml:space="preserve"><tspan fill="#191C24">}</tspan></text>
  <path d="M924 344 v26 M914 360 l10 10 10-10" stroke="#0886A6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <g transform="translate(860 440) scale(0.48)">
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z" fill="#CDEAF2"/>
    <path d="M-120 -40 L0 20 L0 100 L-120 40 Z" fill="#8CC9DB"/>
    <path d="M0 20 L120 -40 L120 40 L0 100 Z" fill="#A9D8E6"/>
    <path d="M-120 -40 L0 -100 L120 -40 L0 20 Z M-120 -40 L-120 40 L0 100 L120 40 L120 -40 M0 20 L0 100" fill="none" stroke="#191C24" stroke-opacity="0.35" stroke-width="1.4"/>
  </g>
  <rect x="962" y="423" width="140" height="34" rx="17" fill="#0886A6"/>
  <text x="1032.0" y="446" fill="#FFFFFF" font-size="17" font-weight="600" text-anchor="middle" font-family="IBM Plex Mono, ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">model.stl</text>
</svg>
